<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F3EDE6">
<title>주보 수정하기</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="icon" href="assets/logo.png?v=20261116a">
<link rel="apple-touch-icon" href="assets/logo.png?v=20261116a">
<script>
(function () {
  var v = "20261116a";
  var t = Date.now();
  document.write('<link rel="stylesheet" href="assets/edit.css?v=' + v + "&t=" + t + '">');
  if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
    navigator.serviceWorker.getRegistrations().then(function (list) {
      for (var i = 0; i < list.length; i++) list[i].unregister();
    });
  }
  if (window.caches && caches.keys) {
    caches.keys().then(function (keys) {
      for (var i = 0; i < keys.length; i++) caches.delete(keys[i]);
    });
  }
})();
</script>
</head>
<body>
<header class="top">
  <a href="index.html">주보 보기</a>
  <strong>주보 수정하기</strong>
</header>
<main id="app">
  <p class="loading">주보를 불러오는 중입니다.</p>
</main>
<div class="actions" id="actions" hidden>
  <button type="button" id="preview-btn">미리보기/인쇄</button>
  <button type="button" id="github-btn">깃허브에 저장</button>
  <button type="button" id="download-btn">파일로 내려받기</button>
</div>
<p class="status" id="status" role="status"></p>
<script>
(function () {
  var v = "20261116a";
  var t = Date.now();
  ["data/church.js", "data/current.js", "assets/edit.js"].forEach(function (src) {
    document.write('<script src="' + src + "?v=" + v + "&t=" + t + '"><\/script>');
  });
})();
</script>
</body>
</html>
